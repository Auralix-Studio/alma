name: Desplegar Sitio en GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "sitio/**"
      - ".github/workflows/paginas.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validar:
    name: Verificación de Calidad antes de Despliegue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ejecutar pruebas de integridad
        run: npm test
        working-directory: ./sitio

  despliegue:
    name: Despliegue a GitHub Pages
    needs: validar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: './sitio'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
