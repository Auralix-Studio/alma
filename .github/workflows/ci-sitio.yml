name: CI Sitio Web y Laboratorio

on:
  push:
    paths:
      - "sitio/**"
      - ".github/workflows/ci-sitio.yml"
  pull_request:
    paths:
      - "sitio/**"
      - ".github/workflows/ci-sitio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-sitio:
    name: Validar Web (${{ matrix.os }} - Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Ejecutar pruebas automatizadas del sitio y motor Alma
        run: npm test
        working-directory: ./sitio
