name: Publicar versión

# Publicación automática: al llegar a main un cambio de VERSION en
# compilador/src/main.zig, se publica v<VERSION> si todavía no existe.
# También se puede publicar a mano subiendo una etiqueta vX.Y.Z (o vX.Y.Z-rc.N
# para versiones de prueba) o desde la pestaña Actions (workflow_dispatch).
on:
  push:
    branches: [ "main" ]
    paths: [ "compilador/src/main.zig" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  decidir:
    name: Decidir la versión a publicar
    runs-on: ubuntu-latest
    outputs:
      etiqueta: ${{ steps.version.outputs.etiqueta }}
      publicar: ${{ steps.version.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^const VERSION = "\(.*\)";/\1/p' compilador/src/main.zig)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then etiqueta="$GITHUB_REF_NAME"; else etiqueta="v$version"; fi
          if gh release view "$etiqueta" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La versión $etiqueta ya está publicada: no hay nada que hacer."
            publicar=false
          else
            echo "Se publicará $etiqueta."
            publicar=true
          fi
          echo "etiqueta=$etiqueta" >> "$GITHUB_OUTPUT"
          echo "publicar=$publicar" >> "$GITHUB_OUTPUT"

  construir:
    name: Construir binarios y extensión
    needs: decidir
    if: needs.decidir.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ETIQUETA: ${{ needs.decidir.outputs.etiqueta }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Zig ${{ env.ZIG_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ziglang.org/download/index.json -o "$RUNNER_TEMP/zig-index.json"
          url=$(jq -r --arg v "$ZIG_VERSION" '.[$v]["x86_64-linux"].tarball' "$RUNNER_TEMP/zig-index.json")
          sha=$(jq -r --arg v "$ZIG_VERSION" '.[$v]["x86_64-linux"].shasum' "$RUNNER_TEMP/zig-index.json")
          curl -fsSL "$url" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$sha  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Comprobar que la etiqueta coincide con la versión de alma
        shell: bash
        run: |
          version=$(sed -n 's/^const VERSION = "\(.*\)";/\1/p' compilador/src/main.zig)
          base="${ETIQUETA#v}"; base="${base%%-*}"
          if [ "$version" != "$base" ]; then
            echo "La etiqueta $ETIQUETA no coincide con VERSION = \"$version\" en main.zig" >&2
            exit 1
          fi

      - name: Pruebas unitarias
        run: zig build test --summary all
        working-directory: ./compilador

      # Cada destino se compila dos veces desde cachés vacías y se compara byte a
      # byte: la versión publicada debe ser reproducible.
      - name: Compilar Windows x64 y Linux x64 (reproducible)
        shell: bash
        working-directory: ./compilador
        run: |
          set -euo pipefail
          mkdir -p ../dist
          compilar() { # destino, binario, nombre publicado
            for i in 1 2; do
              rm -rf .zig-cache zig-global
              ZIG_GLOBAL_CACHE_DIR="$PWD/zig-global" zig build -Dtarget="$1" -Doptimize=ReleaseSafe --prefix "salida-$i"
            done
            cmp "salida-1/bin/$2" "salida-2/bin/$2"
            cp "salida-1/bin/$2" "../dist/$3"
            rm -rf salida-1 salida-2
          }
          compilar x86_64-windows-gnu alma.exe alma-windows-x64.exe
          compilar x86_64-linux-musl alma alma-linux-x64
          compilar aarch64-linux-musl alma alma-linux-arm64
          chmod +x ../dist/alma-linux-x64 ../dist/alma-linux-arm64

      - name: Sumas SHA-256 e instaladores
        shell: bash
        run: |
          set -euo pipefail
          sh distribucion/generar-sumas.sh dist
          cp distribucion/instalar.sh distribucion/instalar.ps1 distribucion/desinstalar.sh distribucion/desinstalar.ps1 dist/

      - name: Empaquetar la extensión
        shell: bash
        working-directory: ./editores/vscode-alma
        run: npx --yes @vscode/vsce@3 package --out ../../dist/alma-lang.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  probar:
    name: Probar instalación (${{ matrix.os }})
    needs: construir
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: Linux ARM64, la misma arquitectura que Android/Termux.
        os: [ ubuntu-latest, ubuntu-24.04-arm, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Instalar y ejecutar (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x dist/alma-linux-x64 dist/alma-linux-arm64
          sh dist/instalar.sh
          "$HOME/.local/bin/alma" version
          "$HOME/.local/bin/alma" ejecutar ejemplos/basicos/factorial.alma

      # Simula el entorno de Termux (PREFIX bajo com.termux): debe instalar en
      # $PREFIX/bin. No sustituye una prueba en un Android real.
      - name: Instalar como en Termux (Linux ARM64)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        shell: bash
        run: |
          set -euo pipefail
          export PREFIX="$RUNNER_TEMP/data/data/com.termux/files/usr"
          mkdir -p "$PREFIX/bin"
          PATH="$PREFIX/bin:$PATH" sh dist/instalar.sh
          "$PREFIX/bin/alma" version
          "$PREFIX/bin/alma" ejecutar ejemplos/basicos/factorial.alma

      - name: Instalar y ejecutar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./dist/instalar.ps1
          $alma = Join-Path $env:LOCALAPPDATA 'Programs\Alma\alma.exe'
          & $alma version
          & $alma ejecutar ejemplos/basicos/factorial.alma
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publicar:
    name: Publicar en GitHub Releases y tiendas
    needs: [ decidir, probar ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ETIQUETA: ${{ needs.decidir.outputs.etiqueta }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Crear la versión en GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prueba=""
          case "$ETIQUETA" in *-*) prueba="--prerelease" ;; esac
          # --target crea la etiqueta sobre este commit cuando la publicación
          # viene de un push a main (con etiqueta ya existente no tiene efecto).
          gh release create "$ETIQUETA" dist/* --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "Alma $ETIQUETA" --generate-notes $prueba

      # Solo en versiones definitivas y si los tokens están configurados como
      # secretos del repositorio (VSCE_PAT y OVSX_PAT).
      - name: Publicar la extensión
        if: ${{ !contains(needs.decidir.outputs.etiqueta, '-') }}
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${VSCE_PAT:-}" ]; then
            npx --yes @vscode/vsce@3 publish --skip-duplicate --packagePath dist/alma-lang.vsix -p "$VSCE_PAT"
          else
            echo "VSCE_PAT no configurado: no se publica en VS Code Marketplace."
          fi
          if [ -n "${OVSX_PAT:-}" ]; then
            npx --yes ovsx@0 publish --skip-duplicate dist/alma-lang.vsix -p "$OVSX_PAT"
          else
            echo "OVSX_PAT no configurado: no se publica en Open VSX."
          fi
